name: Backend lint

# NOTE: workflow files must live at the repository root (.github/workflows).
# The previous copies under backend/.github and frontend/.github were never
# executed by GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ruff linter
        run: uv run ruff check --output-format=github .

      - name: Run ruff formatter
        run: uv run ruff format --check --diff .
